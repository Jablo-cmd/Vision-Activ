name: Vision Activ Production Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Apply pending Supabase migrations to production"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm test -- --coverage
      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://kgvzoolxxpbisqciynkc.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_OyrBlw6EivI0btAgqz8heA_NHnTimpN' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - uses: actions/upload-artifact@v4
        with:
          name: vision-activ-dist
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vision-activ-coverage
          path: coverage
          if-no-files-found: warn

  migrations:
    name: Controlled Supabase migrations
    if: github.event_name == 'workflow_dispatch' && inputs.run_migrations == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
